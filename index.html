<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: white;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            background: #232e3c;
            padding: 15px;
            border-radius: 8px;
        }
        .option {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #2b5278;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
        }
        .option:hover {
            background: #3873a8;
        }
        .correct { background: #4caf50 !important; }
        .wrong { background: #f44336 !important; }
        .score-box {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            padding: 20px;
            background: #232e3c;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">📚 Telegram Quiz</h2>
        <div id="quiz-container">
            <div class="question" id="question-text">Loading...</div>
            <div id="options-container"></div>
        </div>
        <div id="result-container" style="display: none;" class="score-box">
            <p>Quiz Complete! 🎉</p>
            <p>Your Score: <span id="final-score">0</span></p>
        </div>
    </div>

    <script>
        // Telegram Web App initialize karein
        let tg = window.Telegram.WebApp;
        tg.expand(); // Full screen me kholo

        // Sample Questions (Aap chahain toh inhe badal sakte hain)
        const questions = [
            {
                question: "What is the chemical formula of water?",
                options: ["H2O", "CO2", "O2", "NaCl"],
                correct: 0
            },
            {
                question: "Which planet is known as the Red Planet?",
                options: ["Earth", "Mars", "Jupiter", "Venus"],
                correct: 1
            },
            {
                question: "What is 5 + 7?",
                options: ["10", "11", "12", "13"],
                correct: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showResult();
                return;
            }

            const q = questions[currentQuestion];
            document.getElementById("question-text").innerText = q.question;
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btn) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll(".option");

            // Saare buttons disable kar do
            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === q.correct) {
                btn.classList.add("correct");
                score++;
            } else {
                btn.classList.add("wrong");
                // Sahi answer ko green kar do
                buttons[q.correct].classList.add("correct");
            }

            // 1.5 second baad agla question
            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1500);
        }

        function showResult() {
            document.getElementById("quiz-container").style.display = "none";
            document.getElementById("result-container").style.display = "block";
            document.getElementById("final-score").innerText = score + " / " + questions.length;

            // Telegram ko result bhejne ke liye (optional)
            tg.sendData(JSON.stringify({ score: score, total: questions.length }));
        }

        // Pehla question load karo
        loadQuestion();
    </script>
</body>
</html>
